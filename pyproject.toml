[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-pc-auto"                
version = "0.1.2"
description = "Stable WeChat PC session-preview listener with sidebar translation"
readme = "README.md"
authors = [{name = "YourName", email = "your@email.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["wechat", "listener", "uiautomation", "windows", "translation", "sidebar"]
requires-python = ">=3.8"
dependencies = [
    # worker 直接导入 uiautomation；comtypes 作为其传递依赖由预检和 smoke 覆盖。
    "uiautomation>=2.0.18",
    # runtime_api 和 doubao TTS runtime 都依赖 websockets。
    "websockets>=14.0",
    # 腾讯云 TTS runtime 通过 importlib 动态导入 tencentcloud.*。
    "tencentcloud-sdk-python-tts>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourname/wechat-pc-auto"
Repository = "https://github.com/yourname/wechat-pc-auto"
Issues = "https://github.com/yourname/wechat-pc-auto/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_auto*"]               # 关键：必须匹配包名
