[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-pc-auto"                
version = "0.1.4"
description = "Apple Silicon macOS WeChat session-preview listener with local runtime API"
readme = "README.md"
authors = [{name = "YourName", email = "your@email.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
]
keywords = ["wechat", "listener", "macos", "apple-silicon", "translation", "sidebar"]
requires-python = ">=3.9"
dependencies = [
    # runtime_api 依赖 websockets，源码态与 sidecar 都需要它。
    "websockets>=14.0",
    # 腾讯云 TTS runtime 通过 importlib 动态导入 tencentcloud.*。
    "tencentcloud-sdk-python-tts>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourname/wechat-pc-auto"
Repository = "https://github.com/yourname/wechat-pc-auto"
Issues = "https://github.com/yourname/wechat-pc-auto/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_auto*"]               # 关键：必须匹配包名
